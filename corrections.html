<header class="site-header">

    <div class="brand">
      <h1 class="logo"><a href="./" class="logo-link">中立民生新聞</a></h1>
      <p class="tagline">中立、清楚、與生活有關</p>
    </div>
    <div class="banner-meta">
      <p class="today-date" id="today-date"></p>
      <p class="meta-line" id="updated"></p>
    </div>
  </div>

<nav class="tabs-bar" aria-label="頁面">
  <div class="wrap tabs">
    <a class="tab-link" href="./">← 回到最新消息</a>

    <span class="tab-current" aria-current="page">更正紀錄</span>
  </div>

<main class="wrap" id="main">
  <p class="archive-note">已刊登的事實若經查證有誤或有重大變動，一律在此公開記錄（日期、項目、原本錯在哪裡、更正內容），並於該則新聞標示「已更正」；不會在未告知的情況下默默修改。</p>
  <div id="corr-note"></div>
  <section class="corr-types" aria-labelledby="corr-types-h">
    <h2 id="corr-types-h">更正的兩種類型</h2>
    <p><span class="ctag fact">事實更正</span>事實、數字、日期、人名、因果、引述或連結有誤，內容因此改變。</p>
    <p><span class="ctag wording">用語調整</span>只改用語或語氣（例如移除推測性說法、補上出處），事實本身沒有改變。</p>
    <p>有疑義時一律列為「事實更正」；「用語調整」不會用來掩蓋事實錯誤。兩類都會公開記錄。</p>
  </section>
  <div id="corr-filter" class="corr-filter"></div>
  <div id="content"></div>
</main>
<footer class="site-footer">
  <div class="wrap"><p class="small">時間均為台灣時間（UTC+8）。　<a href="archive.html">過往新聞</a>　<a href="./">最新消息</a></p></div>
</footer>
